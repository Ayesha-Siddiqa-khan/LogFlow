    metadata:
      labels:
        app: web-api
    spec:
      containers:
        - name: web-api
          image: logflow-web-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - configMapRef:
                name: web-api-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-api
  namespace: logflow
  labels:
    app: web-api
    app.kubernetes.io/part-of: logflow
spec:
  type: ClusterIP
  selector:
    app: web-api
  ports:
    - name: http
      port: 3002
      targetPort: 3002

---
# ------------------------------------------------------------------------------
